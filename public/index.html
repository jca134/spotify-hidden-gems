<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Top Tracks</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
<header class="topbar">
    <div class="wrap topbar-inner">
        <div class="brand">
            <div class="logo" aria-hidden="true">♫</div>
            <div>
                <div class="brand-title">Spotify Top Tracks</div>
                <div class="brand-subtitle">See what you’ve been looping lately</div>
            </div>
        </div>

        <nav class="actions">
            <a class="btn" href="/login">Log in</a>
            <a class="btn ghost" href="/logout">Logout</a>
        </nav>
    </div>
</header>

<main class="wrap">
    <section class="panel">
        <div class="panel-head">
            <h1 class="title">Your top tracks</h1>
            <p class="muted">Choose a time range and a max popularity, then load your results.</p>
        </div>

        <div class="controls">
            <label class="field">
                <span class="field-label">Time range</span>
                <select id="timeRange" class="select">
                    <option value="short_term">Last 4 weeks</option>
                    <option value="medium_term">Last 6 months</option>
                    <option value="long_term">All time</option>
                </select>
            </label>

            <label class="field">
                <span class="field-label">Max popularity</span>

                <div class="popularity-row">
                    <input
                            id="popularitySlider"
                            class="range"
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            value="100"
                            aria-label="Max popularity slider"
                    />

                    <input
                            id="popularityInput"
                            class="number"
                            type="number"
                            min="0"
                            max="100"
                            step="1"
                            value="100"
                            inputmode="numeric"
                            aria-label="Max popularity number"
                    />
                </div>

                <span class="muted" id="popularityHint">
          Showing tracks with popularity ≤ <strong>100</strong>
        </span>
            </label>

            <button class="btn primary" id="loadBtn">Load tracks</button>
        </div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="results">
        <div id="tracks" class="grid"></div>
    </section>
</main>

<footer class="footer">
    <div class="wrap footer-inner">
        <div class="footer-meta">
            <span class="muted">Built with the Spotify Web API</span>
            <span class="muted">Developed by Jaden Aguilon</span>
        </div>

        <!--
        <p class="footer-note danger">
          ⚠️ Spotify Developer Platform is currently unavailable — login may not work.
        </p>
        -->
    </div>
</footer>

<script src="app.js"></script>
</body>
</html>
